{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<h1>Login</h1>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="POST">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ g.csrf_token }}"
    >

    <label for="username">Username</label>
    <input
        type="text"
        id="username"
        name="username"
        required
    >

    <br><br>

    <label for="password">Master password</label>
    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <br><br>

    <button type="submit">Login</button>

</form>

{% endblock %}
